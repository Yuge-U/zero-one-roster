name: Render and verify ROSTER artwork
on:
  workflow_dispatch:
  push:
    paths:
      - branding/roster-master.png
      - scripts/render-favicon.cjs
      - scripts/render-icons.mjs
      - scripts/verify-brand.cjs
      - .github/workflows/render-icons.yml
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false sharp@0.33.5
      - run: node scripts/render-icons.mjs
      - run: git diff --exit-code -- apple-touch-zero-one-180-20261007m.png apple-touch-icon.png apple-touch-icon-precomposed.png safari-roster-180-20261007g.png safari-roster-192-20261007g.png favicon.ico favicon-roster-20261007f.ico favicon-roster-32-20261007f.png icons/roster.svg icons/roster-180.png icons/roster-192.png icons/roster-512.png
  verify-production:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/verify-brand.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: production-brand-screenshots
          path: production-*.png
