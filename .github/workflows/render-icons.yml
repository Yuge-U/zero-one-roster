name: Render ZERO ONE roster icons
on:
  workflow_dispatch:
  push:
    paths:
      - icons/roster.svg
      - scripts/render-icons.mjs
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install sharp@0.33.5
      - run: node scripts/render-icons.mjs
      - name: Commit rendered icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/roster-192.png icons/roster-512.png
          git diff --cached --quiet || git commit -m "Render ZERO ONE roster icons"
          git push
